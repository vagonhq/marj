name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: smoke test the CLI outside a git repo
        run: |
          cd /tmp && node "$GITHUB_WORKSPACE/dist/server/cli/index.js" --help | head -3
